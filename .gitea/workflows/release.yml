name: Release (Gitea)

# ONLY for Gitea Actions (lives under .gitea/workflows/, which GitHub ignores).
# Lean source-only release WITHOUT binaries: building binaries on Gitea brings
# too many pitfalls (artifact-store 404, ROOT-URL/Docker issues,
# v3/v4 incompatibility, no Windows runner) and it supports only always() in
# 'if:'. Hence deliberately ONE single job without 'needs' and without a
# platform if -- nothing that could hang in "pending".
#
# If you need a binary: download from GitHub or build it yourself via
# 'pip install' + PyInstaller (see README).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release notes (changelog section + fixed footer)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { f=1; next }
            f && /^## \[/            { exit }
            f                        { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No CHANGELOG section found for $VERSION." >&2
            exit 1
          fi
          cat .gitea/release-footer.md >> release-body.md
      - name: Create release (without binaries)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="${GITHUB_SERVER_URL%/}/api/v1/repos/${REPO}/releases"
          AUTH="Authorization: token ${TOKEN}"

          case "$GITHUB_REF_NAME" in
            *-*) PRE=true ;;
            *)   PRE=false ;;
          esac

          cat > build_body.py <<'PYEOF'
          import json, os
          tag = os.environ["GITHUB_REF_NAME"]
          pre = os.environ["PRE"] == "true"
          notes = open("release-body.md", encoding="utf-8").read()
          print(json.dumps({
              "tag_name": tag, "name": tag, "body": notes,
              "draft": False, "prerelease": pre,
          }))
          PYEOF
          BODY_JSON=$(PRE="$PRE" python3 build_body.py)

          HTTP=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "$API" -H "$AUTH" \
            -H "Content-Type: application/json" -d "$BODY_JSON")
          echo "HTTP $HTTP"
          if [ "$HTTP" != "201" ]; then
            echo "Release creation failed:" >&2; cat response.json >&2; exit 1
          fi
          echo "Gitea release $GITHUB_REF_NAME created (without binaries)."
