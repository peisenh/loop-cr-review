name: Unittest + Babel (Gitea)

# ONLY for Gitea Actions (.gitea/workflows/). Same checks as
# .github/workflows/unittest-babel.yml so Homelab and GitHub stay in lockstep.
# No release/binary steps here — those stay GitHub-only.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install babel

      - name: Babel — compile de/en catalogs
        run: |
          set -euo pipefail
          test -f locale/de/LC_MESSAGES/messages.po
          test -f locale/en/LC_MESSAGES/messages.po
          pybabel compile -d locale -l de
          pybabel compile -d locale -l en
          test -f locale/de/LC_MESSAGES/messages.mo
          test -f locale/en/LC_MESSAGES/messages.mo

      - name: Babel — extract must succeed
        run: |
          set -euo pipefail
          pybabel extract -F babel.cfg -o /tmp/messages.pot .
          test -s /tmp/messages.pot

      - name: Unit tests
        run: python -m unittest tests.test_example_data -v
