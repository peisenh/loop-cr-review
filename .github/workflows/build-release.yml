name: Build executables

# Baut eigenständige Binaries für Linux und Windows.
# - manuell (workflow_dispatch): nur bauen + als CI-Artefakt (kein Release)
# - bei Tag "v*": zusätzlich ein ENTWURF-Release mit beiden Binaries — Text von Hand
#   ergänzen und selbst "Publish" klicken, damit nie ein halbfertiges Release online ist.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sep: ":"
            asset: loop-cr-review-linux
          - os: windows-latest
            sep: ";"
            asset: loop-cr-review-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (onefile, Template gebündelt)
        run: >
          pyinstaller --onefile --name loop-cr-review
          --add-data "templates/report.html.j2${{ matrix.sep }}templates"
          loop_cr_review.py

      - name: Smoke-Test (Report aus Beispieldaten erzeugen)
        run: dist/loop-cr-review example-data -o smoke.html

      - name: Artefakt benennen
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/loop-cr-review.exe "${{ matrix.asset }}"
          else
            mv dist/loop-cr-review "${{ matrix.asset }}"
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # Nur bei Tag: beide Binaries einsammeln und in EINEN Entwurf hochladen.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Artefakte einsammeln
        uses: actions/download-artifact@v7
        with:
          path: dist-assets
          merge-multiple: true

      - name: Entwurf-Release mit Binaries
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-assets/*
