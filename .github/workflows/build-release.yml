name: Build executables

# GitHub release: builds self-contained binaries for Linux and Windows and
# attaches them to a release whose text comes from the matching CHANGELOG.md
# section (+ a fixed footer). The release is created by the well-established
# marketplace action softprops/action-gh-release.
#
# Structure deliberately split: the build matrix only builds and uploads the
# binaries as artifacts; ONE separate release job then creates the release
# ONCE with all assets. If matrix jobs each wrote a release to the same tag
# in parallel, that could cause "already_exists" errors or duplicate drafts.
#
# This file is ONLY for GitHub Actions. The Gitea release (without binaries)
# lives separately under .gitea/workflows/release.yml.
#
# GUI backends:
#   Linux  → Qt WebEngine (bundled)
#   Windows → Qt WebEngine (full) + Edge WebView2 (slim, modern Windows)
# Android  → separate job, sideload APK (4 KB page-size wheels, not Play)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sep: ":"
            asset: loop-cr-review-linux
            gui_asset: loop-cr-review-gui-linux
          - os: windows-latest
            sep: ";"
            asset: loop-cr-review-windows.exe
            gui_asset: loop-cr-review-gui-windows-qt.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller babel
      - name: Compile translation catalogs (.po -> .mo)
        run: pybabel compile -d locale
      - name: Bake in version
        shell: bash
        run: echo "VERSION = \"$(git describe --tags --always)\"" > _version.py
      - name: Build CLI (onefile, template + locale bundled)
        run: >
          pyinstaller --onefile --name loop-cr-review
          --add-data "templates/report.html.j2${{ matrix.sep }}templates"
          --add-data "locale${{ matrix.sep }}locale"
          loop_cr_review.py
      - name: Smoke test (generate report from example data)
        run: dist/loop-cr-review example-data -o smoke.html
      - name: Name CLI artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/loop-cr-review.exe "${{ matrix.asset }}"
          else
            mv dist/loop-cr-review "${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      # --- Desktop GUI: Qt (Linux + Windows full) ---------------------------
      - name: Install GUI deps (Qt)
        run: pip install -r requirements-gui.txt
      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0
      - name: Build GUI Qt (onefile, windowed)
        run: >
          pyinstaller --onefile --windowed --name loop-cr-review-gui
          --add-data "templates${{ matrix.sep }}templates"
          --add-data "static${{ matrix.sep }}static"
          --add-data "locale${{ matrix.sep }}locale"
          --collect-all webview
          --collect-all PyQt6
          --collect-all qtpy
          gui.py
      - name: Name GUI Qt artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/loop-cr-review-gui.exe "${{ matrix.gui_asset }}"
          else
            mv dist/loop-cr-review-gui "${{ matrix.gui_asset }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.gui_asset }}
          path: ${{ matrix.gui_asset }}

      # --- Desktop GUI: WebView2 slim (Windows only) ------------------------
      - name: Install GUI deps (WebView2, no Qt)
        if: runner.os == 'Windows'
        run: |
          pip uninstall -y PyQt6 PyQt6-Qt6 PyQt6-WebEngine PyQt6-WebEngine-Qt6 qtpy 2>nul || true
          pip install -r requirements-gui-webview2.txt
      - name: Build GUI WebView2 slim (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --onefile --windowed --name loop-cr-review-gui-webview2
          --add-data "templates${{ matrix.sep }}templates"
          --add-data "static${{ matrix.sep }}static"
          --add-data "locale${{ matrix.sep }}locale"
          --collect-all webview
          gui.py
      - name: Name GUI WebView2 artifact
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/loop-cr-review-gui-webview2.exe loop-cr-review-gui-windows.exe
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: loop-cr-review-gui-windows.exe
          path: loop-cr-review-gui-windows.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: SDK platforms
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build sideload APK
        run: ./tools/build-android-apk.sh
      - uses: actions/upload-artifact@v7
        with:
          name: loop-cr-review-android.apk
          path: dist/loop-cr-review-android.apk

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-assets
          merge-multiple: true
      - name: Build release notes (changelog section + fixed footer)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { f=1; next }
            f && /^## \[/            { exit }
            f                        { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No CHANGELOG section found for $VERSION." >&2
            exit 1
          fi
          cat .github/release-footer.md >> release-body.md
      - name: Create release + attach binaries
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-assets/*
