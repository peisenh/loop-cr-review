name: Build executables

# GitHub release: builds self-contained binaries for Linux and Windows and
# attaches them to a release whose text comes from the matching CHANGELOG.md
# section (+ a fixed footer). The release is created by the well-established
# marketplace action softprops/action-gh-release.
#
# Structure deliberately split: the build matrix only builds and uploads the
# binaries as artifacts; ONE separate release job then creates the release
# ONCE with both assets. If both matrix jobs each wrote a release to the same
# tag in parallel, that could cause "already_exists" errors or duplicate draft
# releases (a known race).
#
# This file is ONLY for GitHub Actions. The Gitea release (without binaries)
# lives separately under .gitea/workflows/release.yml (curl against the Gitea
# API, since there is no equivalent release action there). Once a .gitea/
# directory exists, Gitea ignores these .github/ files entirely anyway.
#
# GUI backend: Qt (pywebview[qt] + PyQt6) instead of GTK/WebKitGTK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sep: ":"
            asset: loop-cr-review-linux
            gui_asset: loop-cr-review-gui-linux
          - os: windows-latest
            sep: ";"
            asset: loop-cr-review-windows.exe
            gui_asset: loop-cr-review-gui-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # volle Historie + Tags, sonst liefert 'git describe' nichts
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller babel
      - name: Compile translation catalogs (.po -> .mo)
        run: pybabel compile -d locale
      - name: Bake in version
        shell: bash
        run: echo "VERSION = \"$(git describe --tags --always)\"" > _version.py
      - name: Build (onefile, template + locale bundled)
        run: >
          pyinstaller --onefile --name loop-cr-review
          --add-data "templates/report.html.j2${{ matrix.sep }}templates"
          --add-data "locale${{ matrix.sep }}locale"
          loop_cr_review.py
      - name: Smoke test (generate report from example data)
        run: dist/loop-cr-review example-data -o smoke.html
      - name: Name artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/loop-cr-review.exe "${{ matrix.asset }}"
          else
            mv dist/loop-cr-review "${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      # --- Desktop GUI binary (pywebview + local server) -------------------
      - name: Install GUI deps
        run: pip install -r requirements-gui.txt
      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0
      - name: Build GUI (onefile, windowed; whole templates + static + locale)
        run: >
          pyinstaller --onefile --windowed --name loop-cr-review-gui
          --add-data "templates${{ matrix.sep }}templates"
          --add-data "static${{ matrix.sep }}static"
          --add-data "locale${{ matrix.sep }}locale"
          --collect-all webview
          --collect-all PyQt6
          --collect-all qtpy
          gui.py
      - name: Name GUI artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/loop-cr-review-gui.exe "${{ matrix.gui_asset }}"
          else
            mv dist/loop-cr-review-gui "${{ matrix.gui_asset }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.gui_asset }}
          path: ${{ matrix.gui_asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7   # CHANGELOG.md + Footer vom getaggten Stand
      - name: Collect artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist-assets
          merge-multiple: true
      - name: Build release notes (changelog section + fixed footer)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"        # v0.4.6 -> 0.4.6
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { f=1; next }
            f && /^## \[/            { exit }
            f                        { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No CHANGELOG section found for $VERSION." >&2
            exit 1
          fi
          cat .github/release-footer.md >> release-body.md
      - name: Create release + attach binaries
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-assets/*
