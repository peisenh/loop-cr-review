name: Build executables

# Baut eigenständige Binaries für Linux und Windows.
# - manuell (workflow_dispatch): nur bauen + als CI-Artefakt (kein Release)
# - bei Tag "v*": zusätzlich ein ENTWURF-Release mit beiden Binaries; der Text
#   wird aus dem passenden CHANGELOG.md-Abschnitt erzeugt und um einen festen
#   Hinweis-Footer (Disclaimer + Binaries) ergänzt. Als Entwurf, damit du vor dem
#   Publish nochmal drüberschaust — Text und Assets sind dann schon fertig drin.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sep: ":"
            asset: loop-cr-review-linux
          - os: windows-latest
            sep: ";"
            asset: loop-cr-review-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # volle Historie + Tags, sonst liefert 'git describe' nichts

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version einbacken
        shell: bash
        run: echo "VERSION = \"$(git describe --tags --always)\"" > _version.py

      - name: Build (onefile, Template gebündelt)
        run: >
          pyinstaller --onefile --name loop-cr-review
          --add-data "templates/report.html.j2${{ matrix.sep }}templates"
          loop_cr_review.py

      - name: Smoke-Test (Report aus Beispieldaten erzeugen)
        run: dist/loop-cr-review example-data -o smoke.html

      - name: Artefakt benennen
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/loop-cr-review.exe "${{ matrix.asset }}"
          else
            mv dist/loop-cr-review "${{ matrix.asset }}"
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # Nur bei Tag: Changelog-Abschnitt + Footer als Text, beide Binaries als Assets,
  # alles in EINEN Entwurf.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7   # CHANGELOG.md + Footer vom getaggten Stand

      - name: Artefakte einsammeln
        uses: actions/download-artifact@v7
        with:
          path: dist-assets
          merge-multiple: true

      - name: Release-Notes bauen (Changelog-Abschnitt + fester Footer)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"        # v0.4.3 -> 0.4.3
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { f=1; next }   # Versions-Header: ab hier drucken
            f && /^## \[/            { exit }         # naechster Block: Schluss
            f                        { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "Kein CHANGELOG-Abschnitt fuer $VERSION gefunden." >&2
            exit 1
          fi
          cat .github/release-footer.md >> release-body.md

      - name: Entwurf-Release mit Binaries
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          body_path: release-body.md
          files: dist-assets/*
          # Pre-Release nur bei '-' im Tag (z. B. v0.5.0-rc1)
          prerelease: ${{ contains(github.ref_name, '-') }}
