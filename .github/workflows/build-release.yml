name: Build executables

# GitHub-Release: baut eigenstaendige Binaries fuer Linux und Windows und
# haengt sie an einen Release, dessen Text aus dem passenden CHANGELOG.md-
# Abschnitt (+ fester Footer) kommt. Erstellt wird der Release von der
# bewaehrten Marketplace-Action softprops/action-gh-release.
#
# Struktur bewusst getrennt: die build-Matrix baut nur und laedt die Binaries
# als Artefakte hoch; EIN separater release-Job erstellt danach den Release
# EINMALIG mit beiden Assets. Wuerden beide Matrix-Jobs parallel je einen
# Release auf denselben Tag schreiben, kann das zu "already_exists"-Fehlern
# oder doppelten Draft-Releases fuehren (bekanntes Race).
#
# Diese Datei ist NUR fuer GitHub Actions. Der Gitea-Release (ohne Binaries)
# liegt getrennt unter .gitea/workflows/release.yml (curl gegen die Gitea-API,
# da es dort keine gleichwertige Release-Action gibt). Sobald ein .gitea/-
# Verzeichnis existiert, ignoriert Gitea diese .github/-Dateien ohnehin ganz.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sep: ":"
            asset: loop-cr-review-linux
          - os: windows-latest
            sep: ";"
            asset: loop-cr-review-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # volle Historie + Tags, sonst liefert 'git describe' nichts
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Version einbacken
        shell: bash
        run: echo "VERSION = \"$(git describe --tags --always)\"" > _version.py
      - name: Build (onefile, Template gebündelt)
        run: >
          pyinstaller --onefile --name loop-cr-review
          --add-data "templates/report.html.j2${{ matrix.sep }}templates"
          loop_cr_review.py
      - name: Smoke-Test (Report aus Beispieldaten erzeugen)
        run: dist/loop-cr-review example-data -o smoke.html
      - name: Artefakt benennen
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/loop-cr-review.exe "${{ matrix.asset }}"
          else
            mv dist/loop-cr-review "${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7   # CHANGELOG.md + Footer vom getaggten Stand
      - name: Artefakte einsammeln
        uses: actions/download-artifact@v7
        with:
          path: dist-assets
          merge-multiple: true
      - name: Release-Notes bauen (Changelog-Abschnitt + fester Footer)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"        # v0.4.6 -> 0.4.6
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { f=1; next }
            f && /^## \[/            { exit }
            f                        { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "Kein CHANGELOG-Abschnitt fuer $VERSION gefunden." >&2
            exit 1
          fi
          cat .github/release-footer.md >> release-body.md
      - name: Release erstellen + Binaries anhaengen
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-assets/*
