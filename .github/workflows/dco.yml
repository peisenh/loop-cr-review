name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on all commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Checking commits ${BASE_SHA}..${HEAD_SHA}"
          fail=0
          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            subject="$(git show -s --format='%s' "$sha")"
            author="$(git show -s --format='%an <%ae>' "$sha")"
            # Merge commits (more than one parent) are exempt.
            if [ "$(git show -s --format='%P' "$sha" | wc -w)" -gt 1 ]; then
              echo "skip merge   $sha  $subject"
              continue
            fi
            if git show -s --format='%B' "$sha" \
                 | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "ok           $sha  $subject"
            else
              echo "MISSING DCO  $sha  $subject  (author: $author)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "One or more commits are missing a Signed-off-by line."
            echo "Add it by committing with -s, e.g.:  git commit -s"
            echo "To sign off existing commits:        git rebase --signoff <base>"
            exit 1
          fi
          echo "All commits are signed off."
